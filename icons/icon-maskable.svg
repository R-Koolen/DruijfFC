<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="gpm" cx="35%" cy="28%" r="65%">
      <stop offset="0%"   stop-color="#DADADA"/>
      <stop offset="100%" stop-color="#646464"/>
    </radialGradient>
  </defs>

  <!-- Background (no border-radius for maskable — OS clips to shape) -->
  <rect width="512" height="512" fill="#0A0E14"/>

  <!-- Stem -->
  <path d="M256,148 C255,128 258,108 254,88" stroke="#A0A0A0" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Leaf -->
  <ellipse cx="295" cy="106" rx="40" ry="17" transform="rotate(-35 295 106)" fill="url(#gpm)" opacity="0.85"/>

  <!-- Row 1: 3 grapes -->
  <circle cx="152" cy="200" r="50" fill="url(#gpm)"/>
  <circle cx="256" cy="200" r="50" fill="url(#gpm)"/>
  <circle cx="360" cy="200" r="50" fill="url(#gpm)"/>

  <!-- Row 2: 2 grapes -->
  <circle cx="204" cy="285" r="50" fill="url(#gpm)"/>
  <circle cx="308" cy="285" r="50" fill="url(#gpm)"/>

  <!-- Row 3: 1 grape -->
  <circle cx="256" cy="370" r="50" fill="url(#gpm)"/>
</svg>
