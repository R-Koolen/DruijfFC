name: Deploy — Forum API

on:
  push:
    branches: [main]
    paths:
      - 'forum-api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image (local)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: forum-api
          file: forum-api/Dockerfile
          load: true
          tags: ghcr.io/r-koolen/druijffc-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/r-koolen/druijffc-api:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: forum-api/.trivyignore.yaml

      - name: Push image
        run: docker push ghcr.io/r-koolen/druijffc-api:latest
