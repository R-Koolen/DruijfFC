<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0B0E" />
  <title>Druijf Meme Heaven — iFruijt</title>
  <link rel="stylesheet" href="../main.css" />
  <link rel="stylesheet" href="forum.css" />
</head>
<body>

<div class="ifruit-shell">

  <!-- TOP CHROME STRIP — iFruijt wordmark -->
  <div class="ifruit-top">
    <div class="ifruit-brand">
      <svg class="ifruit-apple" viewBox="0 0 16 18" aria-hidden="true">
        <path d="M11.5 1.5c.3 1.3-.2 2.5-.9 3.3-.7.9-1.8 1.5-2.9 1.4-.3-1.3.3-2.6 1-3.4.7-.8 1.9-1.4 2.8-1.3zM14.6 13.4c-.5 1.2-.8 1.7-1.5 2.7-1 1.4-2.4 3.2-4.1 3.2-1.5 0-1.9-1-3.9-1-2 0-2.5 1-4 1-1.7 0-3-1.6-4-3-2.7-4-3-8.7-1.3-11.2 1.2-1.8 3.1-2.8 4.9-2.8 1.8 0 3 1 4.5 1 1.5 0 2.4-1 4.5-1 1.6 0 3.3.9 4.5 2.3-4 2.2-3.3 7.9-.6 8.8z" fill="currentColor"/>
      </svg>
      <span class="ifruit-wordmark">iFruijt</span>
    </div>
  </div>

  <!-- PHONE SCREEN -->
  <div class="ifruit-screen">

    <!-- iFruijt status bar -->
    <div class="ifruit-sb" aria-hidden="true">
      <div class="sb-left">
        <svg class="sb-signal" viewBox="0 0 18 14" fill="none">
          <path d="M2 12 Q9 5 16 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4.5 12 Q9 7.5 13.5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 12 Q9 10 11 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="9" cy="12" r="1" fill="currentColor"/>
        </svg>
        <svg class="sb-cloud" viewBox="0 0 18 12" fill="none">
          <path d="M4 10 Q1 10 1 7.5 Q1 5 3.5 5 Q4 3 6.5 3 Q9 3 9.5 5 Q13 5 13 7.5 Q13 10 10 10 Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="sb-center">
        <span class="sb-day">Wo</span>
        <span class="sb-dot">·</span>
        <span class="sb-time">16:42</span>
      </div>
      <div class="sb-right">
        <div class="sb-battery">
          <span class="sb-batt-fill"></span>
        </div>
      </div>
    </div>

    <!-- Gold header bar -->
    <div class="jl-header fm-header">
      <span class="jl-header-title" id="fmHeaderTitle">Druijf Meme Heaven</span>
    </div>

    <!-- CATEGORY SELECTION VIEW -->
    <div class="jl-stage" id="fmCategoryView">
      <div class="jl-section-label">Kies een vakantie</div>
      <div class="fm-category-grid" id="fmCategoryGrid"></div>
    </div>

    <!-- BOARD VIEW (hidden until category selected) -->
    <div class="jl-stage" id="fmBoardView" style="display:none">

      <div class="jl-section-label">Nieuwe meme</div>
      <div class="fm-posted-flash" id="fmFlash">✓ Bericht geplaatst!</div>
      <div class="jl-actions fm-form">
        <input type="text" class="jl-input" id="fmName" placeholder="Naam" maxlength="50" autocomplete="off" />
        <textarea class="jl-input fm-textarea" id="fmContent" placeholder="Meme..." maxlength="280"></textarea>
        <div class="fm-char-count" id="fmCount">0 / 280</div>
        <div class="fm-error" id="fmError"></div>
        <button type="button" class="jl-btn jl-btn--green" id="fmSubmit">Plaatsen</button>
      </div>

      <div class="jl-section-label">Memes</div>
      <div class="jl-list" id="fmList">
        <div class="fm-empty">Nog geen memes — wees de eerste!</div>
      </div>

    </div>

  </div>

  <!-- BOTTOM CHROME STRIP -->
  <nav class="ifruit-bottom" aria-label="iFruijt nav">
    <button type="button" class="ifruit-btn ifruit-btn--side" id="btnRefresh" aria-label="Vernieuwen">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12a8 8 0 018-8 8 8 0 016.928 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 12a8 8 0 01-8 8 8 8 0 01-6.928-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <button type="button" class="ifruit-btn ifruit-btn--check" id="btnCompose" aria-label="Nieuw bericht">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
    </button>

    <button type="button" class="ifruit-btn ifruit-btn--side ifruit-btn--back" id="btnBack" aria-label="Terug">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M20 12H5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </nav>

</div>

<script src="forum.js"></script>
</body>
</html>
